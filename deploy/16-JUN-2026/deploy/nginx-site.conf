# Plantilla Nginx + PHP-FPM.
# Ajustar server_name, root y fastcgi_pass antes de usar.

server {
    listen 80;
    server_name inexo.example.com www.inexo.example.com;

    root /var/www/inexo-rental/current;
    index index.php;

    client_max_body_size 20m;

    location ~ /\. {
        deny all;
    }

    location ~* \.(sqlite3|db|log|env|bak|backup|sql)$ {
        deny all;
    }

    location ^~ /data/ {
        deny all;
    }

    location ^~ /deploy/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
