# Plantilla Apache 2.4 para VPS.
# Ajustar dominios, rutas y version/socket PHP-FPM antes de usar.

<VirtualHost *:80>
    ServerName inexo.example.com
    ServerAlias www.inexo.example.com

    DocumentRoot /var/www/inexo-rental/current

    <Directory /var/www/inexo-rental/current>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/inexo-rental-error.log
    CustomLog ${APACHE_LOG_DIR}/inexo-rental-access.log combined
</VirtualHost>
